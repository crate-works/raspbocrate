update:
  githubActions: true

autoDedupe: true
saveTypes: true

lockfile:
  includeResolutionSettings: true

packages:
  - packages/*
  - website

allowBuilds:
  # Downloads the Prisma schema engine binary used by migrate/db push.
  "@prisma/engines": true
  # Downloads its platform binary; Vite and Astro bundle with it.
  esbuild: true
  # Preinstall checks the Node/environment is supported by Prisma.
  prisma: true

permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-router":
    skills: [router-query, migrate-from-react-router, react-router]
  "@tanstack/react-start":
    skills: [react-start]

skills:
  dirs:
    - .claude/skills
