name: Rebuild images

# Rebuilds the latest release's images so base image security fixes
# (Node.js, Debian, Ubuntu) ship without waiting for a new release.

on:
  schedule:
    - cron: '0 18 * * 0' # Monday 04:00 AEST
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  latest-release:
    name: Find latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Get latest release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${TAG}"

  build:
    name: Rebuild ${{ matrix.image }}
    needs: latest-release
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: raspbocrate
            context: .
            file: packages/raspbocrate/Dockerfile
          - image: raspbocapi
            context: .
            file: packages/raspbocapi/Dockerfile
          - image: opensearch
            context: packages/opensearch
            file: packages/opensearch/Dockerfile
    steps:
      - name: Checkout release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.latest-release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          TAG: ${{ needs.latest-release.outputs.tag }}
          IMAGE: ghcr.io/crate-works/${{ matrix.image }}
        run: |
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"

          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR_MINOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
