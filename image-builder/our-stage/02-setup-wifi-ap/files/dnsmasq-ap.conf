# DHCP/DNS for WiFi AP
interface=wlan0
bind-interfaces
dhcp-range=192.168.4.10,192.168.4.200,255.255.255.0,24h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
domain=local
local=/local/
address=/raspbocrate.local/192.168.4.1
no-resolv
server=8.8.8.8
server=1.1.1.1
cache-size=1000
domain-needed
bogus-priv
expand-hosts
