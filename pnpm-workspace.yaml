update:
  githubActions: true

autoDedupe: true
saveTypes: true

lockfile:
  includeResolutionSettings: true

packages:
  - packages/*
  - website

allowBuilds:
  # Downloads the Prisma schema engine binary used by migrate/db push.
  "@prisma/engines": true
  # Downloads its platform binary; Vite and Astro bundle with it.
  esbuild: true
  # Preinstall checks the Node/environment is supported by Prisma.
  prisma: true
  # Fetches libvips prebuilt binaries; Astro uses it for image optimisation in the website.
  sharp: true
