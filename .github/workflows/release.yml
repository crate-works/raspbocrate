name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.version.outputs.should-release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      - name: Determine next version
        id: version
        run: |
          if [ -f .version ]; then
            VERSION=$(cat .version)
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "Next version: ${VERSION}"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "No release needed"
          fi

  build-raspbocrate:
    name: Build and push raspbocrate
    needs: determine-version
    if: needs.determine-version.outputs.should-release == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          IMAGE: ghcr.io/crate-works/raspbocrate
        run: |
          MAJOR_MINOR="${VERSION%.*}"

          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR_MINOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/raspbocrate/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-raspbocapi:
    name: Build and push raspbocapi
    needs: determine-version
    if: needs.determine-version.outputs.should-release == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          IMAGE: ghcr.io/crate-works/raspbocapi
        run: |
          MAJOR_MINOR="${VERSION%.*}"

          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR_MINOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/raspbocapi/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-opensearch:
    name: Build and push opensearch
    needs: determine-version
    if: needs.determine-version.outputs.should-release == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          IMAGE: ghcr.io/crate-works/opensearch
        run: |
          MAJOR_MINOR="${VERSION%.*}"

          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR_MINOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/opensearch
          file: packages/opensearch/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pi-image:
    name: Build Raspberry Pi image
    needs:
      [determine-version, build-raspbocrate, build-raspbocapi, build-opensearch]
    if: needs.determine-version.outputs.should-release == 'true' && !inputs.dry_run
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        working-directory: image-builder
        run: |
          ./bin/build-image --ci
          sudo chown -R $USER:$USER deploy

      - name: Find and compress image
        id: compress
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          # Find the generated image
          IMAGE_PATH=$(find image-builder/deploy -name "*.img" -type f | head -1)

          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No image file found in image-builder/deploy"
            ls -la image-builder/deploy/
            exit 1
          fi

          # Rename to versioned filename
          RENAMED_PATH="$(dirname "$IMAGE_PATH")/raspbocrate-v${VERSION}.img"
          mv "$IMAGE_PATH" "$RENAMED_PATH"
          IMAGE_PATH="$RENAMED_PATH"

          echo "Found image: $IMAGE_PATH"
          IMAGE_NAME=$(basename "$IMAGE_PATH")

          # Compress with xz (maximum compression, multi-threaded)
          echo "Compressing image..."
          xz -9 -T0 -v "$IMAGE_PATH"

          COMPRESSED_PATH="${IMAGE_PATH}.xz"
          COMPRESSED_NAME="${IMAGE_NAME}.xz"

          echo "Compressed image: $COMPRESSED_PATH"
          ls -lh "$COMPRESSED_PATH"

          # Generate checksum
          cd "$(dirname "$COMPRESSED_PATH")"
          sha256sum "$COMPRESSED_NAME" > "${COMPRESSED_NAME}.sha256"

          echo "Checksum:"
          cat "${COMPRESSED_NAME}.sha256"

          # Set outputs
          echo "image_path=$COMPRESSED_PATH" >> "$GITHUB_OUTPUT"
          echo "image_name=$COMPRESSED_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${COMPRESSED_PATH}.sha256" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${COMPRESSED_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raspbocrate-image
          path: |
            ${{ steps.compress.outputs.image_path }}
            ${{ steps.compress.outputs.checksum_path }}
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-gen-logs
          path: |
            image-builder/pi-gen/deploy/*.log
            image-builder/pi-gen/work/**/*.log
          retention-days: 7

  create-release:
    name: Create release
    needs: [determine-version, build-pi-image]
    if: needs.determine-version.outputs.should-release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Pi image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raspbocrate-image
          path: pi-image

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
