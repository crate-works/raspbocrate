services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: raspbocapi
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: ghcr.io/crate-works/opensearch
    restart: unless-stopped
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q cluster_name"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  raspbocapi:
    image: ghcr.io/crate-works/raspbocapi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node app.ts"]
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/raspbocapi
      DATABASE_USER: root
      DATABASE_PASSWORD: password
      DATABASE_NAME: raspbocapi
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "3000:4000"
    volumes:
      - /media:/media:rslave
      - crate_data:/data

  raspbocrate:
    image: ghcr.io/crate-works/raspbocrate
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:password@mysql:3306/raspbocapi
      DATABASE_HOST: mysql
      DATABASE_USER: root
      DATABASE_PASSWORD: password
      DATABASE_NAME: raspbocapi
      OPENSEARCH_URL: http://opensearch:9200
      DATA_DIR: /data
    volumes:
      - /media:/media:rslave
      - crate_data:/data

  oni-ui:
    image: ghcr.io/crate-works/oni:latest
    restart: unless-stopped
    volumes:
      - /opt/raspbocrate/oni-ui.json:/configuration.json
      - /opt/raspbocrate/logo.png:/usr/share/nginx/html/logo.png

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      - DOZZLE_BASE=/admin/containers
      # Uncomment to enable authentication. See https://dozzle.dev/guide/authentication
      # - DOZZLE_AUTH_PROVIDER=simple

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/raspbocrate/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - oni-ui
      - raspbocrate
      - dozzle

volumes:
  mysql_data:
  opensearch_data:
  crate_data:
